<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armazém das Receitas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <header class="bg-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="goHome()">
                <i class="fa-solid fa-utensils text-orange-600 text-2xl"></i>
                <span class="text-xl font-bold text-gray-900 tracking-tight">Armazém das Receitas</span>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <button id="showFavsBtn" onclick="toggleFavFilter()" class="bg-orange-50 text-orange-600 border border-orange-200 px-3.5 py-2 rounded-lg text-sm font-medium hover:bg-orange-100 transition flex items-center gap-2">
                    <i class="fa-solid fa-heart"></i> Favoritos (<span id="favCount">0</span>)
                </button>
                <button id="adminBtn" onclick="openAdminModal()" class="hidden bg-gray-900 text-white px-3.5 py-2 rounded-lg text-sm font-medium hover:bg-gray-800 transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Nova Receita
                </button>
                <div id="authContainer">
                    <button onclick="openAuthModal()" class="bg-orange-600 text-white px-3.5 py-2 rounded-lg text-sm font-medium hover:bg-orange-700 transition">Entrar</button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <section id="catalogView">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-8 grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3.5 top-3.5 text-gray-400"></i>
                    <input type="text" id="searchInput" oninput="filterRecipes()" placeholder="Buscar por receita ou ingrediente..." class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm">
                </div>
                <select id="categoryFilter" onchange="filterRecipes()" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm bg-white">
                    <option value="tudo">Todas as Categorias</option>
                    <option value="café">Café da Manhã</option>
                    <option value="almoco">Almoço e Jantar</option>
                    <option value="sobremesa">Sobremesas</option>
                </select>
                <select id="timeFilter" onchange="filterRecipes()" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm bg-white">
                    <option value="tudo">Qualquer Tempo</option>
                    <option value="quick">Rápido (até 15 min)</option>
                    <option value="medium">Médio (15 a 30 min)</option>
                    <option value="long">Longo (+30 min)</option>
                </select>
            </div>
            <div id="recipeGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        </section>

        <section id="detailView" class="hidden">
            <button onclick="goHome()" class="mb-6 inline-flex items-center text-sm font-medium text-orange-600 hover:text-orange-700">
                <i class="fa-solid fa-arrow-left mr-2"></i> Voltar para o catálogo
            </button>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <article id="mainRecipeContent" class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden p-6 sm:p-8"></article>
                <aside class="space-y-4">
                    <h3 class="text-lg font-bold text-gray-900 border-b pb-2">Receitas Relacionadas</h3>
                    <div id="relatedList" class="space-y-3"></div>
                </aside>
            </div>
        </section>
    </main>

    <!-- Modal de Login -->
    <div id="authModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 class="text-xl font-bold text-gray-900 mb-4">Entrar</h3>

            <div class="space-y-3 mb-5">
                <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-3 border border-gray-300 bg-white py-2.5 rounded-lg text-sm font-medium hover:bg-gray-50 transition">
                    <i class="fa-brands fa-google text-red-500"></i> Entrar com Google
                </button>
                <button onclick="loginAnonymously()" class="w-full flex items-center justify-center gap-3 border border-gray-300 bg-white py-2.5 rounded-lg text-sm font-medium hover:bg-gray-50 transition">
                    <i class="fa-solid fa-user-secret text-gray-600"></i> Entrar como anônimo
                </button>
            </div>

            <div class="flex items-center gap-3 mb-5 text-xs text-gray-400">
                <div class="flex-grow border-t"></div> ou com e-mail <div class="flex-grow border-t"></div>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                    <input type="email" id="loginEmail" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-orange-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                    <input type="password" id="loginPassword" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-orange-500 text-sm">
                </div>
                <button type="submit" class="w-full bg-orange-600 text-white py-2.5 rounded-lg font-medium hover:bg-orange-700 transition text-sm">Entrar</button>
            </form>
            <p class="text-xs text-gray-500 mt-4">Somente administradores podem adicionar e editar receitas.</p>
        </div>
    </div>

    <!-- Modal Adicionar / Editar Receita -->
    <div id="adminModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-xl w-full p-6 relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 id="formTitle" class="text-xl font-bold text-gray-900 mb-4">Adicionar Nova Receita</h3>
            <form id="recipeForm" onsubmit="saveRecipe(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Título da Receita</label>
                    <input type="text" id="newTitle" required class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Categoria</label>
                        <select id="newCategory" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                            <option value="café">Café da Manhã</option>
                            <option value="almoco">Almoço e Jantar</option>
                            <option value="sobremesa">Sobremesa</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tempo (ex: 20 min)</label>
                        <input type="text" id="newPrepTime" required class="w-full px-3 py-2 border rounded-lg text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">URL da Imagem</label>
                    <input type="url" id="newImage" required class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Ingredientes (um por linha)</label>
                    <textarea id="newIngredients" rows="4" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="1 xícara de farinha..."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Instruções (uma por linha)</label>
                    <textarea id="newInstructions" rows="4" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="Misture os ingredientes..."></textarea>
                </div>
                <button id="saveRecipeBtn" type="submit" class="w-full bg-orange-600 text-white py-2.5 rounded-lg font-medium hover:bg-orange-700 transition text-sm">Salvar Receita</button>
            </form>
        </div>
    </div>

    <script>
        const ADMIN_EMAILS = ["nkauan818@gmail.com"];

        const firebaseConfig = {
            apiKey: "AIzaSyBvAV3n_R7zgMJgRWW65ncz7RKEBFVU9g8",
            authDomain: "armazem-das-receitas.firebaseapp.com",
            projectId: "armazem-das-receitas",
            storageBucket: "armazem-das-receitas.firebasestorage.app",
            messagingSenderId: "38048677953",
            appId: "1:38048677953:web:e6c4b6dc2fe634ed9e06c0",
            measurementId: "G-04K9PQ17JC"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
        
        let pendingWrites = 0;
        window.addEventListener("beforeunload", e => {
            if (pendingWrites > 0) { e.preventDefault(); e.returnValue = ""; }
        });
        
        function showToast(msg, isError) {
            let t = document.getElementById("toast");
            if (!t) {
                t = document.createElement("div");
                t.id = "toast";
                t.className = "fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-lg shadow-lg text-sm font-medium text-white transition";
                document.body.appendChild(t);
            }
            t.textContent = msg;
            t.className = t.className.replace(/bg-\S+/g, "") + (isError ? " bg-red-600" : " bg-gray-900");
            t.style.display = "block";
            clearTimeout(t._timer);
            t._timer = setTimeout(() => { t.style.display = "none"; }, isError ? 7000 : 3000);
        } 
        
        const CATEGORY_LABELS = { "café": "Café da Manhã", "almoco": "Almoço e Jantar", "sobremesa": "Sobremesa" };
        const CATEGORY_EMOJI = { "café": "🥞", "almoco": "🍝", "sobremesa": "🍰" };

        function esc(s) {
            return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }
        function safeUrl(u) {
            try {
                const p = new URL(u);
                return (p.protocol === "http:" || p.protocol === "https:") ? p.href : "";
            } catch { return ""; }
        }
        function placeholderSvg(category) {
            const emoji = CATEGORY_EMOJI[category] || "🍽️";
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffedd5"/><stop offset="1" stop-color="#fed7aa"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><text x="50%" y="54%" font-size="110" text-anchor="middle" dominant-baseline="middle">${emoji}</text></svg>`;
            return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
        }
        function imgTag(recipe, cls) {
            const src = safeUrl(recipe.image) || placeholderSvg(recipe.category);
            const fb = placeholderSvg(recipe.category);
            return `<img src="${esc(src)}" alt="${esc(recipe.title)}" class="${cls}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${fb}'">`;
        }

        const defaultRecipes = [
            { id: 1, title: "Panquecas Americanas", category: "café", prepTime: "15 min", timeMinutes: 15, image: "https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445", ingredients: ["1 xícara de farinha de trigo", "2 colheres de sopa de açúcar", "1 xícara de leite", "1 ovo", "1 colher de fermento"], instructions: ["Misture os ingredientes secos numa tigela.", "Adicione o leite e o ovo e bata até ficar homogêneo.", "Aqueça uma frigideira antiaderente e despeje pequenas porções.", "Vire quando surgirem bolhas e doure o outro lado."] },
            { id: 2, title: "Ovos Mexidos Cremosos", category: "café", prepTime: "10 min", timeMinutes: 10, image: "https://images.unsplash.com/photo-1525351484163-7529414344d8", ingredients: ["3 ovos", "1 colher de manteiga", "2 colheres de creme de leite", "Sal e pimenta a gosto"], instructions: ["Bata os ovos levemente com um garfo.", "Derreta a manteiga em fogo baixo.", "Adicione os ovos e mexa continuamente com uma espátula.", "Desligue o fogo antes de secar totalmente e misture o creme de leite."] }
        ];

        let recipes = [...defaultRecipes];
        let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
        let showOnlyFavs = false;
        let currentUser = null;

        function renderGrid(list) {
            const grid = document.getElementById("recipeGrid");
            if (!list.length) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-12">Nenhuma receita encontrada.</p>`;
                return;
            }
            grid.innerHTML = list.map(r => `
                <div onclick="openDetail(${r.id})" class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden cursor-pointer hover:shadow-md transition flex flex-col">
                    <div class="h-48 overflow-hidden relative">
                        ${imgTag(r, "w-full h-full object-cover hover:scale-105 transition duration-300")}
                        <button onclick="event.stopPropagation(); toggleFav(${r.id})" class="absolute top-3 right-3 bg-white/80 backdrop-blur p-2 rounded-full text-sm ${favorites.includes(r.id) ? 'text-red-500' : 'text-gray-600'} hover:bg-white transition">
                            <i class="fa-${favorites.includes(r.id) ? 'solid' : 'regular'} fa-heart"></i>
                        </button>
                    </div>
                    <div class="p-4 flex flex-col flex-grow">
                        <span class="text-xs font-semibold text-orange-600 uppercase tracking-wider mb-1">${CATEGORY_LABELS[r.category] || r.category}</span>
                        <h3 class="font-bold text-gray-900 text-base mb-2 line-clamp-1">${esc(r.title)}</h3>
                        <div class="mt-auto flex items-center justify-between text-xs text-gray-500 pt-2 border-t border-gray-50">
                            <span><i class="fa-regular fa-clock mr-1"></i> ${esc(r.prepTime)}</span>
                        </div>
                    </div>
                </div>
            `).join("");
            document.getElementById("favCount").textContent = favorites.length;
        }

        function filterRecipes() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const cat = document.getElementById("categoryFilter").value;
            const time = document.getElementById("timeFilter").value;

            let filtered = recipes.filter(r => {
                const matchQuery = r.title.toLowerCase().includes(query) || r.ingredients.some(i => i.toLowerCase().includes(query));
                const matchCat = cat === "tudo" || r.category === cat;
                const matchFav = !showOnlyFavs || favorites.includes(r.id);
                
                let matchTime = true;
                if (time === "quick") matchTime = r.timeMinutes <= 15;
                if (time === "medium") matchTime = r.timeMinutes > 15 && r.timeMinutes <= 30;
                if (time === "long") matchTime = r.timeMinutes > 30;

                return matchQuery && matchCat && matchFav && matchTime;
            });
            renderGrid(filtered);
        }

        function toggleFav(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(f => f !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem("favorites", JSON.stringify(favorites));
            filterRecipes();
        }

        function toggleFavFilter() {
            showOnlyFavs = !showOnlyFavs;
            const btn = document.getElementById("showFavsBtn");
            if (showOnlyFavs) {
                btn.classList.add("bg-orange-100", "border-orange-300");
            } else {
                btn.classList.remove("bg-orange-100", "border-orange-300");
            }
            filterRecipes();
        }

        function openDetail(id) {
            const r = recipes.find(x => x.id === id);
            if (!r) return;

            document.getElementById("catalogView").classList.add("hidden");
            document.getElementById("detailView").classList.remove("hidden");
            window.scrollTo(0, 0);

            document.getElementById("mainRecipeContent").innerHTML = `
                <div class="h-72 rounded-xl overflow-hidden mb-6 relative">
                    ${imgTag(r, "w-full h-full object-cover")}
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-3">${esc(r.title)}</h1>
                <div class="flex items-center gap-4 text-sm text-gray-500 mb-6 pb-4 border-b">
                    <span><i class="fa-regular fa-clock mr-1"></i> ${esc(r.prepTime)}</span>
                    <span><i class="fa-solid tag mr-1"></i> ${CATEGORY_LABELS[r.category]}</span>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                        <h3 class="font-bold text-gray-900 mb-3 text-lg">Ingredientes</h3>
                        <ul class="space-y-2 text-sm text-gray-700">
                            ${r.ingredients.map(i => `<li class="flex items-start"><i class="fa-solid fa-check text-orange-600 mt-1 mr-2 text-xs"></i><span>${esc(i)}</span></li>`).join("")}
                        </ul>
                    </div>
                    <div>
                        <h3 class="font-bold text-gray-900 mb-3 text-lg">Modo de Preparo</h3>
                        <ol class="space-y-3 text-sm text-gray-700">
                            ${r.instructions.map((ins, idx) => `<li class="flex items-start"><span class="bg-orange-100 text-orange-700 font-bold rounded-full w-5 h-5 flex items-center justify-center text-xs mr-2 flex-shrink-0">${idx+1}</span><span>${esc(ins)}</span></li>`).join("")}
                        </ol>
                    </div>
                </div>
            `;

            const related = recipes.filter(x => x.category === r.category && x.id !== r.id).slice(0, 3);
            document.getElementById("relatedList").innerHTML = related.map(rel => `
                <div onclick="openDetail(${rel.id})" class="flex items-center gap-3 bg-white p-2.5 rounded-lg border border-gray-100 cursor-pointer hover:bg-gray-50 transition">
                    <div class="w-16 h-16 rounded-md overflow-hidden flex-shrink-0">${imgTag(rel, "w-full h-full object-cover")}</div>
                    <div>
                        <h4 class="text-sm font-bold text-gray-900 line-clamp-1">${esc(rel.title)}</h4>
                        <span class="text-xs text-gray-500">${esc(rel.prepTime)}</span>
                    </div>
                </div>
            `).join("");
        }

        function goHome() {
            document.getElementById("detailView").classList.add("hidden");
            document.getElementById("catalogView").classList.remove("hidden");
            window.scrollTo(0, 0);
        }

        function openAuthModal() { document.getElementById("authModal").classList.remove("hidden"); document.getElementById("authModal").classList.add("flex"); }
        function closeAuthModal() { document.getElementById("authModal").classList.add("hidden"); document.getElementById("authModal").classList.remove("flex"); }
        function openAdminModal() { document.getElementById("adminModal").classList.remove("hidden"); document.getElementById("adminModal").classList.add("flex"); }
        function closeAdminModal() { document.getElementById("adminModal").classList.add("hidden"); document.getElementById("adminModal").classList.remove("flex"); }

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then(() => closeAuthModal()).catch(err => showToast(err.message, true));
        }

        function loginAnonymously() {
            auth.signInAnonymously().then(() => closeAuthModal()).catch(err => showToast(err.message, true));
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value;
            const pass = document.getElementById("loginPassword").value;
            auth.signInWithEmailAndPassword(email, pass).then(() => closeAuthModal()).catch(err => showToast(err.message, true));
        }

        auth.onAuthStateChanged(user => {
            currentUser = user;
            const container = document.getElementById("authContainer");
            const adminBtn = document.getElementById("adminBtn");

            if (user) {
                const isAdmin = ADMIN_EMAILS.includes(user.email);
                if (isAdmin) adminBtn.classList.remove("hidden");
                else adminBtn.classList.add("hidden");

                container.innerHTML = `<button onclick="auth.signOut()" class="text-sm text-gray-600 hover:text-red-600 font-medium">Sair</button>`;
            } else {
                adminBtn.classList.add("hidden");
                container.innerHTML = `<button onclick="openAuthModal()" class="bg-orange-600 text-white px-3.5 py-2 rounded-lg text-sm font-medium hover:bg-orange-700 transition">Entrar</button>`;
            }
        });

        function saveRecipe(e) {
            e.preventDefault();
            const newRecipe = {
                id: Date.now(),
                title: document.getElementById("newTitle").value,
                category: document.getElementById("newCategory").value,
                prepTime: document.getElementById("newPrepTime").value,
                timeMinutes: 20,
                image: document.getElementById("newImage").value,
                ingredients: document.getElementById("newIngredients").value.split("\n").filter(Boolean),
                instructions: document.getElementById("newInstructions").value.split("\n").filter(Boolean)
            };

            recipes.unshift(newRecipe);
            filterRecipes();
            closeAdminModal();
            document.getElementById("recipeForm").reset();
            showToast("Receita adicionada com sucesso!");
        }

        // Inicialização
        renderGrid(recipes);
    </script>
</body>
</html>
