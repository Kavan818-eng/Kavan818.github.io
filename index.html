<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armazém das Receitas</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="goHome()">
                <i class="fa-solid fa-utensils text-orange-600 text-2xl"></i>
                <span class="text-xl font-bold text-gray-900 tracking-tight">Armazém das Receitas</span>
            </div>

            <!-- Controles de Ação -->
            <div class="flex items-center space-x-3">
                <button id="showFavsBtn" onclick="toggleFavFilter()" class="bg-orange-50 text-orange-600 border border-orange-200 px-3.5 py-2 rounded-lg text-sm font-medium hover:bg-orange-100 transition flex items-center gap-2">
                    <i class="fa-solid fa-heart"></i> Favoritos (<span id="favCount">0</span>)
                </button>
                <button id="adminBtn" onclick="openAdminModal()" class="hidden bg-gray-900 text-white px-3.5 py-2 rounded-lg text-sm font-medium hover:bg-gray-800 transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Nova Receita
                </button>
                <div id="authContainer">
                    <button onclick="openAuthModal()" class="bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-orange-700 transition">
                        Entrar / Admin
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">

        <!-- CATALOG VIEW -->
        <section id="catalogView">
            <!-- Barra de Filtros -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-8 grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3.5 top-3.5 text-gray-400"></i>
                    <input type="text" id="searchInput" oninput="filterRecipes()" placeholder="Buscar por receita ou ingrediente..." class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm">
                </div>
                
                <select id="categoryFilter" onchange="filterRecipes()" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm bg-white">
                    <option value="tudo">Todas as Categorias</option>
                    <option value="café">Café da Manhã</option>
                    <option value="almoco">Almoço e Jantar</option>
                    <option value="sobremesa">Sobremesas</option>
                </select>

                <select id="timeFilter" onchange="filterRecipes()" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm bg-white">
                    <option value="tudo">Qualquer Tempo</option>
                    <option value="quick">Rápido (até 15 min)</option>
                    <option value="medium">Médio (15 a 30 min)</option>
                    <option value="long">Longo (+30 min)</option>
                </select>
            </div>

            <!-- Grid de Receitas -->
            <div id="recipeGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        </section>

        <!-- DETAIL VIEW -->
        <section id="detailView" class="hidden">
            <button onclick="goHome()" class="mb-6 inline-flex items-center text-sm font-medium text-orange-600 hover:text-orange-700">
                <i class="fa-solid fa-arrow-left mr-2"></i> Voltar para o catálogo
            </button>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Conteúdo Principal da Receita -->
                <article id="mainRecipeContent" class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden p-6 sm:p-8"></article>

                <!-- Sidebar de Relacionadas -->
                <aside class="space-y-4">
                    <h3 class="text-lg font-bold text-gray-900 border-b pb-2">Receitas Relacionadas</h3>
                    <div id="relatedList" class="space-y-3"></div>
                </aside>
            </div>
        </section>

    </main>

    <!-- Modal de Login -->
    <div id="authModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 relative">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 class="text-xl font-bold text-gray-900 mb-4">Acesso Administrativo</h3>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                    <input type="email" id="loginEmail" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-orange-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                    <input type="password" id="loginPassword" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-orange-500 text-sm">
                </div>
                <button type="submit" class="w-full bg-orange-600 text-white py-2.5 rounded-lg font-medium hover:bg-orange-700 transition text-sm">Entrar</button>
            </form>
        </div>
    </div>

    <!-- Modal Adicionar Receita (Admin) -->
    <div id="adminModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-xl w-full p-6 relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 class="text-xl font-bold text-gray-900 mb-4">Adicionar Nova Receita</h3>
            <form onsubmit="saveNewRecipe(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Título da Receita</label>
                    <input type="text" id="newTitle" required class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Categoria</label>
                        <select id="newCategory" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                            <option value="café">Café da Manhã</option>
                            <option value="almoco">Almoço e Jantar</option>
                            <option value="sobremesa">Sobremesa</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tempo de Preparo (ex: 20 min)</label>
                        <input type="text" id="newPrepTime" required class="w-full px-3 py-2 border rounded-lg text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">URL da Imagem</label>
                    <input type="url" id="newImage" required class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Ingredientes (um por linha)</label>
                    <textarea id="newIngredients" rows="3" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="1 xícara de farinha..."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Instruções (uma por linha)</label>
                    <textarea id="newInstructions" rows="3" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="Misture os ingredientes..."></textarea>
                </div>
                <button type="submit" class="w-full bg-orange-600 text-white py-2.5 rounded-lg font-medium hover:bg-orange-700 transition text-sm">Salvar Receita</button>
            </form>
        </div>
    </div>

    <!-- JavaScript Principal -->
    <script>

        const firebaseConfig = {
            apiKey: "AIzaSyBvAV3n_R7zgMJgRWW65ncz7RKEBFVU9g8",
            authDomain: "armazem-das-receitas.firebaseapp.com",
            projectId: "armazem-das-receitas",
            storageBucket: "armazem-das-receitas.firebasestorage.app",

        // Base de Dados (30 receitas com imagens verificadas, incluindo brigadeiro correto)
        let recipes = [
            { id: 1, title: "Panquecas Americanas", category: "café", prepTime: "15 min", timeMinutes: 15, image: "https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?w=600&auto=format&fit=crop", ingredients: ["1 xícara de farinha de trigo", "2 colheres de sopa de açúcar", "1 xícara de leite", "1 ovo", "1 colher de fermento"], instructions: ["Misture os ingredientes secos numa tigela.", "Adicione o leite e o ovo e bata até ficar homogêneo.", "Aqueça uma frigideira antiaderente e despeje pequenas porções.", "Vire quando surgirem bolhas e doure o outro lado."] },
            { id: 2, title: "Ovos Mexidos Cremosos", category: "café", prepTime: "10 min", timeMinutes: 10, image: "https://images.unsplash.com/photo-1525351484163-7529414344d8?w=600&auto=format&fit=crop", ingredients: ["3 ovos", "1 colher de manteiga", "2 colheres de creme de leite", "Sal e pimenta a gosto"], instructions: ["Bata os ovos levemente com um garfo.", "Derreta a manteiga em fogo baixo.", "Adicione os ovos e mexa continuamente com uma espátula.", "Desligue o fogo antes de secar totalmente e misture o creme de leite."] },
            { id: 3, title: "Torrada com Abacate (Toast)", category: "café", prepTime: "8 min", timeMinutes: 8, image: "https://images.unsplash.com/photo-1588137378633-dea1336ce1e2?w=600&auto=format&fit=crop", ingredients: ["2 fatias de pão integral", "1 abacate maduro", "Azeite de oliva", "Suco de 1/2 limão", "Sal e pimenta"], instructions: ["Toste as fatias de pão até ficarem crocantes.", "Amasse o abacate com um garfo e tempere com limão, azeite, sal e pimenta.", "Espalhe o abacate sobre as torradas e sirva."] },
            { id: 4, title: "Vitamina de Banana e Aveia", category: "café", prepTime: "5 min", timeMinutes: 5, image: "https://images.unsplash.com/photo-1553530666-ba11a7da3888?w=600&auto=format&fit=crop", ingredients: ["2 bananas maduras", "300ml de leite integral ou vegetal", "2 colheres de sopa de aveia", "1 colher de mel"], instructions: ["Corte as bananas em rodelas.", "Adicione todos os ingredientes no liquidificador.", "Bata por 2 minutos em velocidade alta até obter um creme homogêneo."] },
            { id: 5, title: "Tapioca de Queijo e Presunto", category: "café", prepTime: "7 min", timeMinutes: 7, image: "https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?w=600&auto=format&fit=crop", ingredients: ["3 colheres de massa pronta para tapioca", "2 fatias de queijo muçarela", "2 fatias de presunto", "Orégano"], instructions: ["Peneire a massa na frigideira bem aquecida.", "Espere a massa unir e adicione o queijo e o presunto.", "Polvilhe orégano, dobre ao meio e espere o queijo derreter."] },
            { id: 6, title: "Crepioca FIT", category: "café", prepTime: "10 min", timeMinutes: 10, image: "https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=600&auto=format&fit=crop", ingredients: ["1 ovo", "2 colheres de massa de tapioca", "1 colher de requeijão light", "Sal a gosto"], instructions: ["Bata o ovo com a goma de tapioca e o sal em uma tigela.", "Despeje a mistura em frigideira aquecida.", "Doure dos dois lados e recheie com o requeijão."] },
            { id: 7, title: "Iogurte com Granola e Frutas", category: "café", prepTime: "5 min", timeMinutes: 5, image: "https://images.unsplash.com/photo-1488477181946-6428a0291777?w=600&auto=format&fit=crop", ingredients: ["200g de iogurte natural", "1/2 xícara de granola", "Morangos e mirtilos", "Mel a gosto"], instructions: ["Coloque o iogurte no fundo de uma taça.", "Adicione a granola por cima.", "Decore com as frutas fatiadas e adicione um fio de mel."] },

            { id: 14, title: "Frango Grelhado com Legumes", category: "almoco", prepTime: "20 min", timeMinutes: 20, image: "https://images.unsplash.com/photo-1532550907401-a500c9a57435?w=600&auto=format&fit=crop", ingredients: ["2 filés de peito de frango", "1 abobrinha fatiada", "1 cenoura em rodelas", "Azeite, sal e ervas a gosto"], instructions: ["Tempere o frango com sal, limão e pimenta.", "Grelhe os filés na frigideira com azeite até dourarem.", "Na mesma frigideira, salteie os legumes com uma pitada de sal até ficarem macios."] },
            { id: 15, title: "Risoto Simples de Queijo", category: "almoco", prepTime: "30 min", timeMinutes: 30, image: "https://images.unsplash.com/photo-1633964913295-ceb43826e7c9?w=600&auto=format&fit=crop", ingredients: ["1 xícara de arroz arbóreo", "1/2 xícara de vinho branco", "1 litro de caldo de legumes", "100g de queijo parmesão", "2 colheres de manteiga"], instructions: ["Refogue a cebola com manteiga e adicione o arroz.", "Adicione o vinho e mexa até evaporar.", "Vá adicionando o caldo quente aos poucos, mexendo sempre.", "Ao final, adicione a manteiga restante e o queijo parmesão."] },
            { id: 16, title: "Omelete Recheada", category: "almoco", prepTime: "10 min", timeMinutes: 10, image: "https://images.unsplash.com/photo-1510693206972-df098062cb71?w=600&auto=format&fit=crop", ingredients: ["3 ovos", "1 tomate picado", "50g de presunto e queijo em cubos", "Sal, pimenta e orégano"], instructions: ["Bata os ovos com os temperos.", "Despeje na frigideira untada.", "Quando a base firmar, coloque o tomate, queijo e presunto num dos lados.", "Dobre a omelete ao meio e sirva."] },
            { id: 17, title: "Feijoada Rápida", category: "almoco", prepTime: "45 min", timeMinutes: 45, image: "https://images.unsplash.com/photo-1541832676-9b763b0239ab?w=600&auto=format&fit=crop", ingredients: ["500g de feijão preto cozido", "200g de linguiça calabresa", "100g de bacon em cubos", "Alho e cebola picados", "Folha de louro"], instructions: ["Frite o bacon e a calabresa até dourarem.", "Refogue a cebola e o alho na mesma gordura.", "Junte o feijão cozido e o louro, deixando apurar por 15 minutos em fogo baixo."] },

            { id: 24, title: "Brigadeiro Tradicional", category: "sobremesa", prepTime: "15 min", timeMinutes: 15, image: "https://images.unsplash.com/photo-1579372786545-d24232daf58c?w=600&auto=format&fit=crop", ingredients: ["1 lata de leite condensado", "2 colheres de cacau em pó", "1 colher de manteiga", "Granulado de chocolate"], instructions: ["Misture todos os ingredientes numa panela.", "Cozinhe em fogo médio mexendo constantemente até soltar do fundo.", "Deixe esfriar, enrolar e passe no granulado."] },
            { id: 25, title: "Pudim de Leite Condensado", category: "sobremesa", prepTime: "60 min", timeMinutes: 60, image: "https://images.unsplash.com/photo-1528975604071-b4dc52a2d18c?w=600&auto=format&fit=crop", ingredients: ["1 lata de leite condensado", "1 lata de leite (mesma medida)", "3 ovos", "1 xícara de açúcar para calda"], instructions: ["Derreta o açúcar na forma de pudim até virar caramelo.", "Bata no liquidificador o leite condensado, leite e ovos.", "Despeje na forma e asse em banho-maria por 50 minutos."] },
            { id: 26, title: "Mousse de Maracujá", category: "sobremesa", prepTime: "10 min", timeMinutes: 10, image: "https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=600&auto=format&fit=crop", ingredients: ["1 lata de leite condensado", "1 lata de creme de leite", "1 xícara de suco concentrado de maracujá"], instructions: ["Bata todos os ingredientes no liquidificador por 3 minutos.", "Despeje em taças e leve à geladeira por 2 horas antes de servir."] },
            { id: 27, title: "Brownie de Chocolate", category: "sobremesa", prepTime: "35 min", timeMinutes: 35, image: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=600&auto=format&fit=crop", ingredients: ["200g de chocolate meio amargo", "1/2 xícara de manteiga", "1 xícara de açúcar", "3/4 xícara de farinha de trigo"], instructions: ["Derreta o chocolate junto com a manteiga.", "Misture o açúcar e a farinha.", "Despeje em uma forma untada e asse por 25 minutos a 180°C."] },
            { id: 28, title: "Bolo de Cenoura", category: "sobremesa", prepTime: "45 min", timeMinutes: 45, image: "https://images.unsplash.com/photo-1621303837174-89787a7d4729?w=600&auto=format&fit=crop", ingredients: ["3 cenouras médias", "1/2 xícara de óleo", "3 ovos", "2 xícaras de açúcar", "2 xícaras de farinha de trigo"], instructions: ["Bata a cenoura, o óleo e os ovos no liquidificador.", "Misture a massa com a farinha e açúcar numa tigela.", "Asse por 40 minutos a 180°C."] },
            { id: 29, title: "Salada de Frutas Frescas", category: "sobremesa", prepTime: "15 min", timeMinutes: 15, image: "https://images.unsplash.com/photo-1490474418585-ba9bad8fd0ea?w=600&auto=format&fit=crop", ingredients: ["1 maçã", "1 banana", "1/2 mamão", "1 xícara de suco de laranja"], instructions: ["Pique todas as frutas em cubos pequenos.", "Misture-as em uma tigela grande e adicione o suco de laranja.", "Sirva gelado."] },
            { id: 30, title: "Gelatina Colorida", category: "sobremesa", prepTime: "20 min", timeMinutes: 20, image: "https://images.unsplash.com/photo-1559181567-c3190ca9959b?w=600&auto=format&fit=crop", ingredients: ["2 pacotes de gelatina de sabores variados", "1 lata de leite condensado", "1 lata de creme de leite"], instructions: ["Prepare as gelatinas separadamente e corte em cubos.", "Bata no liquidificador o leite condensado com creme de leite.", "Misture os cubos de gelatina com o creme e leve à geladeira."] }
        ];

        let favorites = JSON.parse(localStorage.getItem('recipe_favorites')) || [];
        let activeFilterOnlyFavs = false;
        let currentServings = 2;
        let currentUser = null;

        // Estado de Autenticação Firebase
        auth.onAuthStateChanged(user => {
            currentUser = user;
            const authContainer = document.getElementById("authContainer");
            const adminBtn = document.getElementById("adminBtn");

            if (user) {
                authContainer.innerHTML = `<button onclick="handleLogout()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-lg font-medium transition">Sair (${user.email})</button>`;
                adminBtn.classList.remove("hidden");
            } else {
                authContainer.innerHTML = `<button onclick="openAuthModal()" class="bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-orange-700 transition">Entrar / Admin</button>`;
                adminBtn.classList.add("hidden");
            }
        });

        function openAuthModal() { document.getElementById("authModal").classList.remove("hidden"); document.getElementById("authModal").classList.add("flex"); }
        function closeAuthModal() { document.getElementById("authModal").classList.add("hidden"); document.getElementById("authModal").classList.remove("flex"); }
        function openAdminModal() { document.getElementById("adminModal").classList.remove("hidden"); document.getElementById("adminModal").classList.add("flex"); }
        function closeAdminModal() { document.getElementById("adminModal").classList.add("hidden"); document.getElementById("adminModal").classList.remove("flex"); }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value;
            const pass = document.getElementById("loginPassword").value;
            auth.signInWithEmailAndPassword(email, pass)
                .then(() => { closeAuthModal(); alert("Login realizado com sucesso!"); })
                .catch(err => alert("Erro ao entrar: " + err.message));
        }

        function handleLogout() { auth.signOut(); }

        function saveNewRecipe(e) {
            e.preventDefault();
            const newRecipe = {
                id: Date.now(),
                title: document.getElementById("newTitle").value,
                category: document.getElementById("newCategory").value,
                prepTime: document.getElementById("newPrepTime").value,
                timeMinutes: parseInt(document.getElementById("newPrepTime").value) || 20,
                image: document.getElementById("newImage").value,
                ingredients: document.getElementById("newIngredients").value.split("\n").filter(i => i.trim() !== ""),
                instructions: document.getElementById("newInstructions").value.split("\n").filter(i => i.trim() !== "")
            };

            recipes.unshift(newRecipe);
            closeAdminModal();
            filterRecipes();
            alert("Receita adicionada com sucesso!");
        }

        function updateFavCount() {
            document.getElementById("favCount").textContent = favorites.length;
        }

        function toggleFavorite(id, event) {
            if (event) event.stopPropagation();
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('recipe_favorites', JSON.stringify(favorites));
            updateFavCount();
            filterRecipes();
        }

        function toggleFavFilter() {
            activeFilterOnlyFavs = !activeFilterOnlyFavs;
            const btn = document.getElementById("showFavsBtn");
            if (activeFilterOnlyFavs) {
                btn.classList.add("bg-orange-600", "text-white");
                btn.classList.remove("bg-orange-50", "text-orange-600");
            } else {
                btn.classList.remove("bg-orange-600", "text-white");
                btn.classList.add("bg-orange-50", "text-orange-600");
            }
            filterRecipes();
        }

        function displayRecipes(list) {
            const grid = document.getElementById("recipeGrid");
            grid.innerHTML = "";
            if (list.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">Nenhuma receita encontrada.</div>`;
                return;
            }

            list.forEach(recipe => {
                const isFav = favorites.includes(recipe.id);
                const card = document.createElement("div");
                card.className = "bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition cursor-pointer flex flex-col group";
                card.onclick = () => showRecipeDetails(recipe.id);

                card.innerHTML = `
                    <div class="relative h-48 overflow-hidden bg-gray-100">
                        <img src="${recipe.image}" alt="${recipe.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        <button onclick="toggleFavorite(${recipe.id}, event)" class="absolute top-3 right-3 w-9 h-9 bg-white/90 backdrop-blur rounded-full flex items-center justify-center text-gray-600 hover:text-red-500 shadow transition">
                            <i class="${isFav ? 'fa-solid text-red-500' : 'fa-regular'} fa-heart"></i>
                        </button>
                    </div>
                    <div class="p-4 flex flex-col flex-grow">
                        <span class="text-xs font-semibold text-orange-600 uppercase tracking-wider mb-1">${recipe.category}</span>
                        <h3 class="font-bold text-gray-900 text-base mb-2 line-clamp-1">${recipe.title}</h3>
                        <div class="mt-auto flex items-center text-xs text-gray-500"><i class="fa-regular fa-clock mr-1.5"></i> ${recipe.prepTime}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterRecipes() {
            const search = document.getElementById("searchInput").value.toLowerCase();
            const cat = document.getElementById("categoryFilter").value;
            const time = document.getElementById("timeFilter").value;

            const filtered = recipes.filter(r => {
                const matchSearch = r.title.toLowerCase().includes(search) || r.ingredients.some(i => i.toLowerCase().includes(search));
                const matchCat = cat === "tudo" || r.category === cat;
                const matchFav = !activeFilterOnlyFavs || favorites.includes(r.id);
                let matchTime = true;
                if (time === "quick") matchTime = r.timeMinutes <= 15;
                if (time === "medium") matchTime = r.timeMinutes > 15 && r.timeMinutes <= 30;
                if (time === "long") matchTime = r.timeMinutes > 30;
                return matchSearch && matchCat && matchFav && matchTime;
            });
            displayRecipes(filtered);
        }

        function formatIngredient(str, mult) {
            return str.replace(/(\d+[\/\d\.]*)/g, (match) => {
                let val = parseFloat(match);
                if (isNaN(val)) return match;
                let calc = (val * (mult / 2)).toFixed(1);
                return calc.endsWith('.0') ? parseInt(calc) : calc;
            });
        }

        function showRecipeDetails(id) {
            const recipe = recipes.find(r => r.id === id);
            if (!recipe) return;
            currentServings = 2;

            document.getElementById("catalogView").classList.add("hidden");
            document.getElementById("detailView").classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: 'smooth' });

            renderDetailCard(recipe);
            renderRelated(recipe);
        }

        function renderDetailCard(recipe) {
            const container = document.getElementById("mainRecipeContent");
            const isFav = favorites.includes(recipe.id);

            container.innerHTML = `
                <div class="relative h-72 sm:h-96 rounded-xl overflow-hidden mb-6 bg-gray-100">
                    <img src="${recipe.image}" alt="${recipe.title}" class="w-full h-full object-cover">
                    <button onclick="toggleFavorite(${recipe.id}, event); renderDetailCard(recipes.find(r => r.id === ${recipe.id}))" class="absolute top-4 right-4 w-11 h-11 bg-white/90 backdrop-blur rounded-full flex items-center justify-center text-gray-700 hover:text-red-500 shadow-md transition">
                        <i class="${isFav ? 'fa-solid text-red-500' : 'fa-regular'} fa-heart text-lg"></i>
                    </button>
                </div>
                <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
                    <span class="text-xs font-semibold text-orange-600 uppercase tracking-wider bg-orange-50 px-3 py-1 rounded-full">${recipe.category}</span>
                    <span class="text-sm text-gray-500"><i class="fa-regular fa-clock mr-1"></i> ${recipe.prepTime}</span>
                </div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 mb-6">${recipe.title}</h1>
                
                <!-- Ajuste de Porções -->
                <div class="bg-orange-50/50 border border-orange-100 p-4 rounded-xl flex items-center justify-between mb-6">
                    <span class="text-sm font-medium text-gray-700">Porções:</span>
                    <div class="flex items-center space-x-3">
                        <button onclick="changeServings(${recipe.id}, -1)" class="w-8 h-8 bg-white border border-gray-200 rounded-lg font-bold text-gray-700 hover:bg-gray-50">-</button>
                        <span id="servingsCount" class="font-bold text-gray-900">${currentServings}</span>
                        <button onclick="changeServings(${recipe.id}, 1)" class="w-8 h-8 bg-white border border-gray-200 rounded-lg font-bold text-gray-700 hover:bg-gray-50">+</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                        <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center"><i class="fa-solid fa-basket-shopping text-orange-600 mr-2"></i> Ingredientes</h3>
                        <ul class="space-y-2.5 text-gray-700 text-sm">
                            ${recipe.ingredients.map(i => `<li class="flex items-start"><span class="w-2 h-2 bg-orange-500 rounded-full mt-2 mr-2.5 flex-shrink-0"></span><span>${formatIngredient(i, currentServings)}</span></li>`).join('')}
                        </ul>
                    </div>
                    <div>
                        <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center"><i class="fa-solid fa-list-ol text-orange-600 mr-2"></i> Modo de Preparo</h3>
                        <ol class="space-y-4 text-gray-700 text-sm">
                            ${recipe.instructions.map((ins, idx) => `<li class="flex items-start"><span class="font-bold text-orange-600 mr-3 flex-shrink-0">${idx + 1}.</span><span>${ins}</span></li>`).join('')}
                        </ol>
                    </div>
                </div>
            `;
        }

        function changeServings(id, delta) {
            currentServings = Math.max(1, currentServings + delta);
            const recipe = recipes.find(r => r.id === id);
            if (recipe) renderDetailCard(recipe);
        }

        function renderRelated(recipe) {
            const list = document.getElementById("relatedList");
            list.innerHTML = "";
            const related = recipes.filter(r => r.category === recipe.category && r.id !== recipe.id).slice(0, 3);
            
            if (related.length === 0) {
                list.innerHTML = `<p class="text-sm text-gray-500">Nenhuma outra receita relacionada.</p>`;
                return;
            }

            related.forEach(rel => {
                const item = document.createElement("div");
                item.className = "flex items-center space-x-3 bg-white p-3 rounded-xl border border-gray-100 hover:shadow-sm transition cursor-pointer";
                item.onclick = () => showRecipeDetails(rel.id);
                item.innerHTML = `
                    <img src="${rel.image}" alt="${rel.title}" class="w-16 h-16 object-cover rounded-lg flex-shrink-0">
                    <div>
                        <h4 class="font-bold text-gray-900 text-sm line-clamp-1">${rel.title}</h4>
                        <span class="text-xs text-gray-500">${rel.prepTime}</span>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function goHome() {
            document.getElementById("detailView").classList.add("hidden");
            document.getElementById("catalogView").classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Inicialização
        updateFavCount();
        filterRecipes();
    </script>
</body>
</html>
