<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armazém das Receitas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <header class="bg-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="goHome()">
                <i class="fa-solid fa-utensils text-orange-600 text-2xl"></i>
                <span class="text-xl font-bold text-gray-900 tracking-tight">Armazém das Receitas</span>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <button id="showFavsBtn" onclick="toggleFavFilter()" class="bg-orange-50 text-orange-600 border border-orange-200 px-3.5 py-2 rounded-lg text-sm font-medium hover:bg-orange-100 transition flex items-center gap-2">
                    <i class="fa-solid fa-heart"></i> Favoritos (<span id="favCount">0</span>)
                </button>
                <button id="adminBtn" onclick="openAdminModal()" class="hidden bg-gray-900 text-white px-3.5 py-2 rounded-lg text-sm font-medium hover:bg-gray-800 transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Nova Receita
                </button>
                <div id="authContainer"></div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <section id="catalogView">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-8 grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3.5 top-3.5 text-gray-400"></i>
                    <input type="text" id="searchInput" oninput="filterRecipes()" placeholder="Buscar por receita ou ingrediente..." class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm">
                </div>
                <select id="categoryFilter" onchange="filterRecipes()" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm bg-white">
                    <option value="tudo">Todas as Categorias</option>
                    <option value="café">Café da Manhã</option>
                    <option value="almoco">Almoço e Jantar</option>
                    <option value="sobremesa">Sobremesas</option>
                </select>
                <select id="timeFilter" onchange="filterRecipes()" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm bg-white">
                    <option value="tudo">Qualquer Tempo</option>
                    <option value="quick">Rápido (até 15 min)</option>
                    <option value="medium">Médio (15 a 30 min)</option>
                    <option value="long">Longo (+30 min)</option>
                </select>
            </div>
            <div id="recipeGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        </section>

        <section id="detailView" class="hidden">
            <button onclick="goHome()" class="mb-6 inline-flex items-center text-sm font-medium text-orange-600 hover:text-orange-700">
                <i class="fa-solid fa-arrow-left mr-2"></i> Voltar para o catálogo
            </button>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <article id="mainRecipeContent" class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden p-6 sm:p-8"></article>
                <aside class="space-y-4">
                    <h3 class="text-lg font-bold text-gray-900 border-b pb-2">Receitas Relacionadas</h3>
                    <div id="relatedList" class="space-y-3"></div>
                </aside>
            </div>
        </section>
    </main>

    <!-- Modal de Login -->
    <div id="authModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 class="text-xl font-bold text-gray-900 mb-4">Entrar</h3>

            <div class="space-y-3 mb-5">
                <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-3 border border-gray-300 bg-white py-2.5 rounded-lg text-sm font-medium hover:bg-gray-50 transition">
                    <i class="fa-brands fa-google text-red-500"></i> Entrar com Google
                </button>
            </div>

            <div class="flex items-center gap-3 mb-5 text-xs text-gray-400">
                <div class="flex-grow border-t"></div> ou com e-mail <div class="flex-grow border-t"></div>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                    <input type="email" id="loginEmail" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-orange-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                    <input type="password" id="loginPassword" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-orange-500 text-sm">
                </div>
                <button type="submit" class="w-full bg-orange-600 text-white py-2.5 rounded-lg font-medium hover:bg-orange-700 transition text-sm">Entrar</button>
                <button type="button" onclick="handleRegister()" class="w-full border border-orange-200 text-orange-700 py-2.5 rounded-lg font-medium hover:bg-orange-50 transition text-sm">Criar uma conta</button>
            </form>
            <p class="text-xs text-gray-500 mt-4">Entre ou crie uma conta para favoritar receitas e comentar. Somente administradores podem adicionar e editar receitas.</p>
        </div>
    </div>

    <!-- Modal Adicionar / Editar Receita -->
    <div id="adminModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-xl w-full p-6 relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 id="formTitle" class="text-xl font-bold text-gray-900 mb-4">Adicionar Nova Receita</h3>
            <form id="recipeForm" onsubmit="saveRecipe(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Título da Receita</label>
                    <input type="text" id="newTitle" required class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Categoria</label>
                        <select id="newCategory" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                            <option value="café">Café da Manhã</option>
                            <option value="almoco">Almoço e Jantar</option>
                            <option value="sobremesa">Sobremesa</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tempo (ex: 20 min, 1h30)</label>
                        <input type="text" id="newPrepTime" required class="w-full px-3 py-2 border rounded-lg text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">URL da Imagem</label>
                    <input type="url" id="newImage" required class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Ingredientes (um por linha)</label>
                    <textarea id="newIngredients" rows="4" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="1 xícara de farinha..."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Instruções (uma por linha)</label>
                    <textarea id="newInstructions" rows="4" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="Misture os ingredientes..."></textarea>
                </div>
                <button id="saveRecipeBtn" type="submit" class="w-full bg-orange-600 text-white py-2.5 rounded-lg font-medium hover:bg-orange-700 transition text-sm">Salvar Receita</button>
            </form>
        </div>
    </div>

    <script>
        // ================= CONFIGURAÇÃO =================
        // Coloque aqui o(s) e-mail(s) dos administradores (o mesmo e-mail que usa no Google ou no login por senha).
        // IMPORTANTE: use os mesmos e-mails nas regras do Firestore, senão o salvamento será negado.
        const ADMIN_EMAILS = ["nkauan818@gmail.com"];

        const firebaseConfig = {

            authDomain: "armazem-das-receitas.firebaseapp.com",
            projectId: "armazem-das-receitas",

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Guarda gravações no navegador: se você sair antes de sincronizar, elas são enviadas depois
        db.enablePersistence({ synchronizeTabs: true }).catch(() => {});

        let pendingWrites = 0;
        window.addEventListener("beforeunload", e => {
            if (pendingWrites > 0) { e.preventDefault(); e.returnValue = ""; }
        });

        function showToast(msg, isError) {
            let t = document.getElementById("toast");
            if (!t) {
                t = document.createElement("div");
                t.id = "toast";
                t.className = "fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-lg shadow-lg text-sm font-medium text-white transition";
                document.body.appendChild(t);
            }
            t.textContent = msg;
            t.classList.remove("bg-red-600", "bg-gray-900");
            t.classList.add(isError ? "bg-red-600" : "bg-gray-900");
            t.style.display = "block";
            clearTimeout(t._timer);
            t._timer = setTimeout(() => { t.style.display = "none"; }, isError ? 7000 : 3000);
        }

        // ================= UTILIDADES =================
        const CATEGORY_LABELS = { "café": "Café da Manhã", "almoco": "Almoço e Jantar", "sobremesa": "Sobremesa" };
        const CATEGORY_EMOJI = { "café": "🥞", "almoco": "🍝", "sobremesa": "🍰" };

        // Foto por palavra-chave (estável por "lock"): não depende de IDs de fotos que podem sumir.
        const foodImg = (keywords, n) => `https://loremflickr.com/600/400/${keywords}?lock=${n}`;

        function esc(s) {
            return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }
        function safeUrl(u) {
            try {
                const p = new URL(u);
                return (p.protocol === "http:" || p.protocol === "https:") ? p.href : "";
            } catch { return ""; }
        }
        // Placeholder (SVG local, nunca quebra) caso a foto não carregue
        function placeholderSvg(category) {
            const emoji = CATEGORY_EMOJI[category] || "🍽️";
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffedd5"/><stop offset="1" stop-color="#fed7aa"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><text x="50%" y="54%" font-size="110" text-anchor="middle" dominant-baseline="middle">${emoji}</text></svg>`;
            return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
        }
        function imgTag(recipe, cls) {
            const src = safeUrl(recipe.image) || placeholderSvg(recipe.category);
            const fb = placeholderSvg(recipe.category);
            return `<img src="${esc(src)}" alt="${esc(recipe.title)}" class="${cls}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${fb}'">`;
        }

        function parseMinutes(text) {
            const t = String(text).toLowerCase();
            const h = t.match(/(\d+)\s*h/);
            if (h) {
                const after = t.slice(t.indexOf(h[0]) + h[0].length).match(/(\d+)/);
                return parseInt(h[1]) * 60 + (after ? parseInt(after[1]) : 0);
            }
            const m = t.match(/(\d+)/);
            return m ? parseInt(m[1]) : 20;
        }

        function fmtNumber(n) {
            const whole = Math.floor(n + 1e-9);
            const frac = n - whole;
            const map = [[0, ""], [1/4, "1/4"], [1/3, "1/3"], [1/2, "1/2"], [2/3, "2/3"], [3/4, "3/4"], [1, "+"]];
            for (const [v, s] of map) {
                if (Math.abs(frac - v) < 0.05) {
                    if (s === "+") return String(whole + 1);
                    if (s === "") return String(whole);
                    return whole > 0 ? `${whole} ${s}` : s;
                }
            }
            return n.toFixed(1).replace(".", ",").replace(/,0$/, "");
        }
        function formatIngredient(str, servings) {
            const factor = servings / 2;
            const re = /(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?)(?![\d°º])/g;
            const scaled = String(str).replace(re, (match) => {
                let val;
                if (/^\d+\s+\d+\/\d+$/.test(match)) {
                    const [w, f] = match.split(/\s+/);
                    const [a, b] = f.split("/");
                    val = parseInt(w) + parseInt(a) / parseInt(b);
                } else if (match.includes("/")) {
                    const [a, b] = match.split("/");
                    val = parseInt(a) / parseInt(b);
                } else {
                    val = parseFloat(match.replace(",", "."));
                }
                if (!isFinite(val)) return match;
                return fmtNumber(val * factor);
            });
            return esc(scaled);
        }

        // ================= DADOS =================
        const defaultRecipes = [

            { id: 4, title: "Vitamina de Banana e Aveia", category: "café", prepTime: "5 min", timeMinutes: 5, image: foodImg("smoothie", 4), ingredients: ["2 bananas maduras", "300ml de leite integral ou vegetal", "2 colheres de sopa de aveia", "1 colher de mel"], instructions: ["Corte as bananas em rodelas.", "Adicione todos os ingredientes no liquidificador.", "Bata por 2 minutos em velocidade alta até obter um creme homogêneo."] },
            { id: 5, title: "Tapioca de Queijo e Presunto", category: "café", prepTime: "7 min", timeMinutes: 7, image: foodImg("tapioca", 5), ingredients: ["3 colheres de massa pronta para tapioca", "2 fatias de queijo muçarela", "2 fatias de presunto", "Orégano"], instructions: ["Peneire a massa na frigideira bem aquecida.", "Espere a massa unir e adicione o queijo e o presunto.", "Polvilhe orégano, dobre ao meio e espere o queijo derreter."] },
            { id: 6, title: "Crepioca FIT", category: "café", prepTime: "10 min", timeMinutes: 10, image: foodImg("crepe", 6), ingredients: ["1 ovo", "2 colheres de massa de tapioca", "1 colher de requeijão light", "Sal a gosto"], instructions: ["Bata o ovo com a goma de tapioca e o sal em uma tigela.", "Despeje a mistura em frigideira aquecida.", "Doure dos dois lados e recheie com o requeijão."] },
            { id: 7, title: "Iogurte com Granola e Frutas", category: "café", prepTime: "5 min", timeMinutes: 5, image: foodImg("yogurt,granola", 7), ingredients: ["200g de iogurte natural", "1/2 xícara de granola", "Morangos e mirtilos", "Mel a gosto"], instructions: ["Coloque o iogurte no fundo de uma taça.", "Adicione a granola por cima.", "Decore com as frutas fatiadas e adicione um fio de mel."] },
            { id: 8, title: "Pão de Queijo de Frigideira", category: "café", prepTime: "12 min", timeMinutes: 12, image: foodImg("paodequeijo", 8), ingredients: ["1 ovo", "2 colheres de polvilho azedo", "1 colher de requeijão", "50g de queijo ralado", "Pitada de sal"], instructions: ["Misture bem todos os ingredientes com um garfo.", "Despeje em frigideira untada em fogo baixo.", "Doure de um lado e depois vire para dourar o outro."] },
            { id: 9, title: "Spaghetti à Carbonara", category: "almoco", prepTime: "25 min", timeMinutes: 25, image: foodImg("carbonara", 9), ingredients: ["200g de espaguete", "100g de bacon picado", "2 gemas de ovo", "50g de queijo parmesão", "Pimenta-do-reino"], instructions: ["Cozinhe o macarrão em água com sal.", "Frite o bacon até ficar crocante.", "Misture as gemas com o queijo ralado e pimenta numa tigela.", "Junte o macarrão quente ao bacon, desligue o fogo e incorpore a mistura de ovos."] },
            { id: 10, title: "Strogonoff de Frango", category: "almoco", prepTime: "30 min", timeMinutes: 30, image: foodImg("stroganoff", 10), ingredients: ["500g de peito de frango em cubos", "1 lata de creme de leite", "2 colheres de ketchup", "1 colher de mostarda", "1/2 cebola picada"], instructions: ["Refogue a cebola e doure o frango.", "Adicione a mostarda, o ketchup e os cogumelos se desejar.", "Desligue o fogo e misture o creme de leite.", "Sirva com arroz e batata palha."] },
            { id: 11, title: "Arroz de Carreteiro Fácil", category: "almoco", prepTime: "35 min", timeMinutes: 35, image: foodImg("rice,beef", 11), ingredients: ["2 xícaras de arroz", "200g de carne seca dessalgada", "1 linguiça calabresa", "Cebola e alho picados", "Cheiro-verde"], instructions: ["Frite a carne seca e a calabresa até dourarem.", "Adicione o alho, cebola e refogue.", "Junte o arroz, adicione água quente e cozinhe em fogo baixo.", "Finalize com cheiro-verde."] },
            { id: 12, title: "Escondidinho de Carne Moída", category: "almoco", prepTime: "40 min", timeMinutes: 40, image: foodImg("shepherdspie", 12), ingredients: ["500g de batata cozida", "400g de carne moída", "Leite e manteiga", "100g de queijo muçarela"], instructions: ["Cozinhe a carne moída temperada a gosto.", "Amasse as batatas e misture com leite e manteiga para criar um purê.", "Num refratário, coloque a carne moída e cubra com o purê.", "Cubra com queijo e leve ao forno para gratinar."] },
            { id: 13, title: "Macarrão ao Molho Pesto", category: "almoco", prepTime: "15 min", timeMinutes: 15, image: foodImg("pesto,pasta", 13), ingredients: ["200g de macarrão penne", "1 xícara de folhas de manjericão", "1/2 xícara de azeite", "1 dente de alho", "50g de queijo parmesão"], instructions: ["Cozinhe a massa al dente.", "No processador ou liquidificador, bata o manjericão, azeite, alho e parmesão.", "Misture o pesto diretamente sobre o macarrão quente."] },
            { id: 14, title: "Frango Grelhado com Legumes", category: "almoco", prepTime: "20 min", timeMinutes: 20, image: foodImg("grilledchicken", 14), ingredients: ["2 filés de peito de frango", "1 abobrinha fatiada", "1 cenoura em rodelas", "Azeite, sal e ervas a gosto"], instructions: ["Tempere o frango com sal, limão e pimenta.", "Grelhe os filés na frigideira com azeite até dourarem.", "Na mesma frigideira, salteie os legumes com uma pitada de sal até ficarem macios."] },
            { id: 15, title: "Risoto Simples de Queijo", category: "almoco", prepTime: "30 min", timeMinutes: 30, image: foodImg("risotto", 15), ingredients: ["1 xícara de arroz arbóreo", "1/2 xícara de vinho branco", "1 litro de caldo de legumes", "100g de queijo parmesão", "2 colheres de manteiga"], instructions: ["Refogue a cebola com manteiga e adicione o arroz.", "Adicione o vinho e mexa até evaporar.", "Vá adicionando o caldo quente aos poucos, mexendo sempre.", "Ao final, adicione a manteiga restante e o queijo parmesão."] },
            { id: 16, title: "Omelete Recheada", category: "almoco", prepTime: "10 min", timeMinutes: 10, image: foodImg("omelette", 16), ingredients: ["3 ovos", "1 tomate picado", "50g de presunto e queijo em cubos", "Sal, pimenta e orégano"], instructions: ["Bata os ovos com os temperos.", "Despeje na frigideira untada.", "Quando a base firmar, coloque o tomate, queijo e presunto num dos lados.", "Dobre a omelete ao meio e sirva."] },

            { id: 28, title: "Bolo de Cenoura", category: "sobremesa", prepTime: "45 min", timeMinutes: 45, image: foodImg("carrotcake", 28), ingredients: ["3 cenouras médias", "1/2 xícara de óleo", "3 ovos", "2 xícaras de açúcar", "2 xícaras de farinha de trigo"], instructions: ["Bata a cenoura, o óleo e os ovos no liquidificador.", "Misture a massa com a farinha e açúcar numa tigela.", "Asse por 40 minutos a 180°C."] },
            { id: 29, title: "Salada de Frutas Frescas", category: "sobremesa", prepTime: "15 min", timeMinutes: 15, image: foodImg("fruitsalad", 29), ingredients: ["1 maçã", "1 banana", "1/2 mamão", "1 xícara de suco de laranja"], instructions: ["Pique todas as frutas em cubos pequenos.", "Misture-as em uma tigela grande e adicione o suco de laranja.", "Sirva gelado."] },
            { id: 30, title: "Gelatina Colorida", category: "sobremesa", prepTime: "20 min", timeMinutes: 20, image: foodImg("jello,gelatin", 30), ingredients: ["2 pacotes de gelatina de sabores variados", "1 lata de leite condensado", "1 lata de creme de leite"], instructions: ["Prepare as gelatinas separadamente e corte em cubos.", "Bata no liquidificador o leite condensado com creme de leite.", "Misture os cubos de gelatina com o creme e leve à geladeira."] }
        ];
        const defaultIds = new Set(defaultRecipes.map(r => r.id));

        let recipes = [...defaultRecipes];
        let firestoreDocs = new Map(); // id -> dados salvos (receitas novas e edições de receitas padrão)

        // Favoritos são carregados da subcoleção users/{uid}/favorites.
        let favorites = [];
        let favoriteCounts = new Map();
        let favoritesUnsub = null;
        let commentsUnsub = null;

        let activeFilterOnlyFavs = false;
        let currentServings = 2;
        let currentUser = null;
        let currentRecipeId = null;
        let editingId = null;

        // Receitas padrão (com edições do admin por cima) + receitas novas
        function rebuildRecipes() {
            const customs = [];
            firestoreDocs.forEach((data, id) => { if (!defaultIds.has(id)) customs.push(data); });
            customs.sort((a, b) => (b.id || 0) - (a.id || 0));
            const base = defaultRecipes.map(r => firestoreDocs.has(r.id) ? { ...r, ...firestoreDocs.get(r.id) } : r);
            recipes = [...customs, ...base];
        }

        db.collection("recipes").onSnapshot(
            snap => {
                firestoreDocs = new Map();
                favoriteCounts = new Map();
                snap.docs.forEach(d => {
                    const data = d.data() || {};
                    const numericId = Number(d.id);
                    if (Number.isFinite(numericId) && data.favoriteCount !== undefined) {
                        favoriteCounts.set(numericId, Number(data.favoriteCount) || 0);
                    }
                    if (data.title && typeof data.id === "number") firestoreDocs.set(data.id, data);
                });
                rebuildRecipes();
                filterRecipes();
                if (currentRecipeId !== null && !document.getElementById("detailView").classList.contains("hidden")) {
                    const r = recipes.find(x => x.id === currentRecipeId);
                    if (r) { renderDetailCard(r); renderRelated(r); }
                }
            },
            err => { console.error("Não foi possível carregar receitas do Firestore:", err); showToast("Erro ao carregar receitas: " + err.message, true); }
        );

        // ================= AUTENTICAÇÃO =================
        function isAdmin() {
            return !!(currentUser && !currentUser.isAnonymous && currentUser.email &&
                ADMIN_EMAILS.map(e => e.toLowerCase()).includes(currentUser.email.toLowerCase()));
        }

        auth.onAuthStateChanged(user => {
            // Encerra sessões anônimas antigas que possam ter ficado salvas no navegador.
            if (user && user.isAnonymous) { auth.signOut(); return; }
            currentUser = user || null;
            if (favoritesUnsub) { favoritesUnsub(); favoritesUnsub = null; }
            favorites = [];

            const authContainer = document.getElementById("authContainer");
            const adminBtn = document.getElementById("adminBtn");

            if (currentUser) {
                const label = currentUser.displayName || currentUser.email || "Usuário";
                const badge = isAdmin() ? `<span class="text-[10px] font-bold bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full">ADMIN</span>` : "";
                authContainer.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="hidden sm:inline text-xs text-gray-600 max-w-[160px] truncate">${esc(label)}</span>
                        ${badge}
                        <button onclick="handleLogout()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-lg font-medium transition">Sair</button>
                    </div>`;
                favoritesUnsub = db.collection("users").doc(currentUser.uid).collection("favorites").onSnapshot(snap => {
                    favorites = snap.docs.map(d => Number(d.id)).filter(Number.isFinite);
                    updateFavCount();
                    filterRecipes();
                    if (currentRecipeId !== null) {
                        const r = recipes.find(x => x.id === currentRecipeId);
                        if (r) renderDetailCard(r);
                    }
                }, err => showToast("Erro ao carregar favoritos: " + err.message, true));
            } else {
                authContainer.innerHTML = `<button onclick="openAuthModal()" class="bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-orange-700 transition">Entrar</button>`;
            }
            adminBtn.classList.toggle("hidden", !isAdmin());
            updateFavCount();
            if (!isAdmin()) closeAdminModal();
            if (currentRecipeId !== null && !document.getElementById("detailView").classList.contains("hidden")) {
                const r = recipes.find(x => x.id === currentRecipeId);
                if (r) renderDetailCard(r);
            }
        });

        function toggleModal(id, open) {
            const el = document.getElementById(id);
            el.classList.toggle("hidden", !open);
            el.classList.toggle("flex", open);
        }
        function openAuthModal() { toggleModal("authModal", true); }
        function closeAuthModal() { toggleModal("authModal", false); }
        function closeAdminModal() { toggleModal("adminModal", false); }

        document.addEventListener("keydown", e => {
            if (e.key === "Escape") { closeAuthModal(); closeAdminModal(); }
        });

        function authErrorMessage(err) {
            const map = {
                "auth/invalid-credential": "E-mail ou senha incorretos.",
                "auth/invalid-email": "E-mail inválido.",
                "auth/user-disabled": "Esta conta foi desativada.",
                "auth/too-many-requests": "Muitas tentativas. Tente novamente mais tarde.",
                "auth/network-request-failed": "Falha de rede. Verifique sua conexão.",
                "auth/operation-not-allowed": "Este método de login não está ativado. Ative-o em Firebase Console > Authentication > Sign-in method.",
                "auth/unauthorized-domain": "Este domínio não está autorizado. Adicione-o em Firebase Console > Authentication > Settings > Authorized domains.",
                "auth/popup-blocked": "O navegador bloqueou a janela de login. Libere pop-ups para este site.",
                "auth/configuration-not-found": "O Authentication não está configurado neste projeto. Ative-o em Firebase Console > Authentication.",
                "auth/account-exists-with-different-credential": "Já existe uma conta com este e-mail usando outro método de login."
            };
            return map[err.code] || err.message;
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value.trim();
            const pass = document.getElementById("loginPassword").value;
            auth.signInWithEmailAndPassword(email, pass)
                .then(() => { closeAuthModal(); e.target.reset(); })
                .catch(err => alert("Erro ao entrar: " + authErrorMessage(err)));
        }

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: "select_account" });
            auth.signInWithPopup(provider)
                .then(() => closeAuthModal())
                .catch(err => {
                    if (err.code === "auth/popup-closed-by-user" || err.code === "auth/cancelled-popup-request") return;
                    alert("Erro ao entrar com Google: " + authErrorMessage(err));
                });
        }

        function handleRegister() {
            const email = document.getElementById("loginEmail").value.trim();
            const pass = document.getElementById("loginPassword").value;
            if (!email || pass.length < 6) {
                alert("Informe um e-mail válido e uma senha com pelo menos 6 caracteres.");
                return;
            }
            auth.createUserWithEmailAndPassword(email, pass)
                .then(() => { closeAuthModal(); document.getElementById("loginEmail").value = ""; document.getElementById("loginPassword").value = ""; showToast("Conta criada com sucesso!"); })
                .catch(err => alert("Erro ao criar conta: " + authErrorMessage(err)));
        }

        function handleLogout() { auth.signOut(); }

        // ================= ADMIN: ADICIONAR / EDITAR =================
        function openAdminModal(id) {
            if (!isAdmin()) { alert("Apenas administradores podem adicionar ou editar receitas."); return; }
            const form = document.getElementById("recipeForm");
            form.reset();
            document.getElementById("saveRecipeBtn").disabled = false;
            editingId = (typeof id === "number") ? id : null;

            if (editingId !== null) {
                const r = recipes.find(x => x.id === editingId);
                if (!r) return;
                document.getElementById("formTitle").textContent = "Editar Receita";
                document.getElementById("saveRecipeBtn").textContent = "Salvar Alterações";
                document.getElementById("newTitle").value = r.title;
                document.getElementById("newCategory").value = r.category;
                document.getElementById("newPrepTime").value = r.prepTime;
                document.getElementById("newImage").value = r.image || "";
                document.getElementById("newIngredients").value = (r.ingredients || []).join("\n");
                document.getElementById("newInstructions").value = (r.instructions || []).join("\n");
            } else {
                document.getElementById("formTitle").textContent = "Adicionar Nova Receita";
                document.getElementById("saveRecipeBtn").textContent = "Salvar Receita";
            }
            toggleModal("adminModal", true);
        }

        function saveRecipe(e) {
            e.preventDefault();
            if (!isAdmin()) { alert("Apenas administradores podem salvar receitas."); return; }

            const prepTime = document.getElementById("newPrepTime").value.trim();
            const isEdit = editingId !== null;
            const id = isEdit ? editingId : Date.now();

            const data = {
                id,
                title: document.getElementById("newTitle").value.trim(),
                category: document.getElementById("newCategory").value,
                prepTime,
                timeMinutes: parseMinutes(prepTime),
                image: document.getElementById("newImage").value.trim(),
                ingredients: document.getElementById("newIngredients").value.split("\n").map(s => s.trim()).filter(Boolean),
                instructions: document.getElementById("newInstructions").value.split("\n").map(s => s.trim()).filter(Boolean),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedBy: currentUser.email
            };
            if (!firestoreDocs.has(id)) data.createdAt = firebase.firestore.FieldValue.serverTimestamp();

            // Fecha o formulário na hora; o Firebase sincroniza em segundo plano
            closeAdminModal();
            editingId = null;
            showToast("Salvando...");

            pendingWrites++;
            db.collection("recipes").doc(String(id)).set(data, { merge: true })
                .then(() => {
                    pendingWrites--;
                    showToast(isEdit ? "Receita atualizada ✓" : "Receita adicionada ✓");
                })
                .catch(err => {
                    pendingWrites--;
                    showToast("Não foi salvo: " + err.message, true);
                });
        }

        // ================= FAVORITOS =================
        function updateFavCount() { document.getElementById("favCount").textContent = favorites.length; }
        function getFavoriteCount(id) { return favoriteCounts.get(Number(id)) || 0; }

        async function toggleFavorite(id, event) {
            if (event) event.stopPropagation();
            if (!currentUser) {
                showToast("Entre ou crie uma conta para salvar favoritos.", true);
                openAuthModal();
                return;
            }
            const ref = db.collection("users").doc(currentUser.uid).collection("favorites").doc(String(id));
            try {
                if (favorites.includes(id)) await ref.delete();
                else await ref.set({ recipeId: id, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
            } catch (err) {
                showToast("Não foi possível atualizar o favorito: " + err.message, true);
            }
        }

        function toggleFavFilter() {
            activeFilterOnlyFavs = !activeFilterOnlyFavs;
            const btn = document.getElementById("showFavsBtn");
            btn.classList.toggle("bg-orange-600", activeFilterOnlyFavs);
            btn.classList.toggle("text-white", activeFilterOnlyFavs);
            btn.classList.toggle("bg-orange-50", !activeFilterOnlyFavs);
            btn.classList.toggle("text-orange-600", !activeFilterOnlyFavs);
            if (!document.getElementById("detailView").classList.contains("hidden")) goHome();
            filterRecipes();
        }

        // ================= CATÁLOGO =================
        function displayRecipes(list) {
            const grid = document.getElementById("recipeGrid");
            grid.innerHTML = "";
            if (list.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">Nenhuma receita encontrada.</div>`;
                return;
            }
            list.forEach(recipe => {
                const isFav = favorites.includes(recipe.id);
                const card = document.createElement("div");
                card.className = "bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition cursor-pointer flex flex-col group";
                card.onclick = () => showRecipeDetails(recipe.id);
                card.innerHTML = `
                    <div class="relative h-48 overflow-hidden bg-orange-50">
                        ${imgTag(recipe, "w-full h-full object-cover group-hover:scale-105 transition duration-300")}
                        <button onclick="toggleFavorite(${recipe.id}, event)" aria-label="Favoritar" class="absolute top-3 right-3 w-9 h-9 bg-white/90 backdrop-blur rounded-full flex items-center justify-center text-gray-600 hover:text-red-500 shadow transition">
                            <i class="${isFav ? 'fa-solid text-red-500' : 'fa-regular'} fa-heart"></i>
                        </button>
                    </div>
                    <div class="p-4 flex flex-col flex-grow">
                        <span class="text-xs font-semibold text-orange-600 uppercase tracking-wider mb-1">${esc(CATEGORY_LABELS[recipe.category] || recipe.category)}</span>
                        <h3 class="font-bold text-gray-900 text-base mb-2 line-clamp-1">${esc(recipe.title)}</h3>
                        <div class="mt-auto flex items-center justify-between text-xs text-gray-500"><span><i class="fa-regular fa-clock mr-1.5"></i>${esc(recipe.prepTime)}</span><span><i class="fa-solid fa-heart text-red-400 mr-1"></i>${getFavoriteCount(recipe.id)} favorito(s)</span></div>
                    </div>`;
                grid.appendChild(card);
            });
        }

        function filterRecipes() {
            const search = document.getElementById("searchInput").value.toLowerCase().trim();
            const cat = document.getElementById("categoryFilter").value;
            const time = document.getElementById("timeFilter").value;

            const filtered = recipes.filter(r => {
                const matchSearch = r.title.toLowerCase().includes(search) || (r.ingredients || []).some(i => i.toLowerCase().includes(search));
                const matchCat = cat === "tudo" || r.category === cat;
                const matchFav = !activeFilterOnlyFavs || favorites.includes(r.id);
                let matchTime = true;
                if (time === "quick") matchTime = r.timeMinutes <= 15;
                if (time === "medium") matchTime = r.timeMinutes > 15 && r.timeMinutes <= 30;
                if (time === "long") matchTime = r.timeMinutes > 30;
                return matchSearch && matchCat && matchFav && matchTime;
            });
            displayRecipes(filtered);
        }

        // ================= DETALHE =================
        function showRecipeDetails(id) {
            const recipe = recipes.find(r => r.id === id);
            if (!recipe) return;
            currentServings = 2;
            currentRecipeId = id;

            document.getElementById("catalogView").classList.add("hidden");
            document.getElementById("detailView").classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: 'smooth' });

            renderDetailCard(recipe);
            renderRelated(recipe);
        }

        function renderDetailCard(recipe) {
            const container = document.getElementById("mainRecipeContent");
            const isFav = favorites.includes(recipe.id);
            const editBtn = isAdmin()
                ? `<button onclick="openAdminModal(${recipe.id})" class="inline-flex items-center gap-2 text-xs font-medium bg-gray-900 text-white px-3 py-1.5 rounded-lg hover:bg-gray-800 transition"><i class="fa-solid fa-pen"></i> Editar</button>`
                : "";

            container.innerHTML = `
                <div class="relative h-72 sm:h-96 rounded-xl overflow-hidden mb-6 bg-orange-50">
                    ${imgTag(recipe, "w-full h-full object-cover")}
                    <button onclick="toggleFavorite(${recipe.id}, event)" aria-label="Favoritar" class="absolute top-4 right-4 w-11 h-11 bg-white/90 backdrop-blur rounded-full flex items-center justify-center text-gray-700 hover:text-red-500 shadow-md transition">
                        <i class="${isFav ? 'fa-solid text-red-500' : 'fa-regular'} fa-heart text-lg"></i>
                    </button>
                </div>
                <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
                    <span class="text-xs font-semibold text-orange-600 uppercase tracking-wider bg-orange-50 px-3 py-1 rounded-full">${esc(CATEGORY_LABELS[recipe.category] || recipe.category)}</span>
                    <div class="flex items-center gap-3">
                        <span class="text-sm text-gray-500"><i class="fa-regular fa-clock mr-1"></i> ${esc(recipe.prepTime)}</span>
                        ${editBtn}
                    </div>
                </div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 mb-2">${esc(recipe.title)}</h1>
                <p class="text-sm text-gray-500 mb-6"><i class="fa-solid fa-heart text-red-400 mr-1"></i>${getFavoriteCount(recipe.id)} pessoa(s) favoritaram esta receita</p>

                <div class="bg-orange-50/50 border border-orange-100 p-4 rounded-xl flex items-center justify-between mb-6">
                    <span class="text-sm font-medium text-gray-700">Porções:</span>
                    <div class="flex items-center space-x-3">
                        <button onclick="changeServings(${recipe.id}, -1)" class="w-8 h-8 bg-white border border-gray-200 rounded-lg font-bold text-gray-700 hover:bg-gray-50">-</button>
                        <span id="servingsCount" class="font-bold text-gray-900">${currentServings}</span>
                        <button onclick="changeServings(${recipe.id}, 1)" class="w-8 h-8 bg-white border border-gray-200 rounded-lg font-bold text-gray-700 hover:bg-gray-50">+</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                        <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center"><i class="fa-solid fa-basket-shopping text-orange-600 mr-2"></i> Ingredientes</h3>
                        <ul class="space-y-2.5 text-gray-700 text-sm">
                            ${(recipe.ingredients || []).map(i => `<li class="flex items-start"><span class="w-2 h-2 bg-orange-500 rounded-full mt-2 mr-2.5 flex-shrink-0"></span><span>${formatIngredient(i, currentServings)}</span></li>`).join('')}
                        </ul>
                    </div>
                    <div>
                        <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center"><i class="fa-solid fa-list-ol text-orange-600 mr-2"></i> Modo de Preparo</h3>
                        <ol class="space-y-4 text-gray-700 text-sm">
                            ${(recipe.instructions || []).map((ins, idx) => `<li class="flex items-start"><span class="font-bold text-orange-600 mr-3 flex-shrink-0">${idx + 1}.</span><span>${esc(ins)}</span></li>`).join('')}
                        </ol>
                    </div>
                </div>

                <section class="mt-10 border-t border-gray-100 pt-8">
                    <h2 class="text-xl font-bold text-gray-900 mb-4">Comentários</h2>
                    <form onsubmit="addComment(event, ${recipe.id})" class="mb-6">
                        <textarea id="commentInput" maxlength="1000" required rows="3" placeholder="Compartilhe sua opinião sobre esta receita..." class="w-full border border-gray-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" ${currentUser ? "" : "disabled"}></textarea>
                        <div class="flex items-center justify-between mt-2 gap-3">
                            <span class="text-xs text-gray-500">${currentUser ? "Seja respeitoso nos comentários." : "Entre para comentar."}</span>
                            <button type="submit" ${currentUser ? "" : "disabled"} class="bg-orange-600 disabled:bg-gray-300 text-white px-4 py-2 rounded-lg text-sm font-medium">Enviar comentário</button>
                        </div>
                    </form>
                    <div id="commentsList" class="space-y-4"><p class="text-sm text-gray-500">Carregando comentários...</p></div>
                </section>`;
            listenComments(recipe.id);
        }

        function listenComments(recipeId) {
            if (commentsUnsub) commentsUnsub();
            const list = document.getElementById("commentsList");
            if (!list) return;
            commentsUnsub = db.collection("recipes").doc(String(recipeId)).collection("comments")
                .orderBy("createdAt", "desc").limit(50).onSnapshot(snap => {
                    const target = document.getElementById("commentsList");
                    if (!target) return;
                    if (snap.empty) { target.innerHTML = `<p class="text-sm text-gray-500">Ainda não há comentários. Seja o primeiro!</p>`; return; }
                    target.innerHTML = snap.docs.map(doc => {
                        const c = doc.data();
                        const date = c.createdAt && c.createdAt.toDate ? c.createdAt.toDate().toLocaleString("pt-BR") : "Agora";
                        return `<article class="bg-gray-50 rounded-xl p-4"><div class="flex items-center justify-between gap-3 mb-2"><strong class="text-sm text-gray-900">${esc(c.authorName || "Usuário")}</strong><time class="text-xs text-gray-500">${esc(date)}</time></div><p class="text-sm text-gray-700 whitespace-pre-wrap break-words">${esc(c.text || "")}</p></article>`;
                    }).join("");
                }, err => {
                    const target = document.getElementById("commentsList");
                    if (target) target.innerHTML = `<p class="text-sm text-red-600">Erro ao carregar comentários: ${esc(err.message)}</p>`;
                });
        }

        async function addComment(event, recipeId) {
            event.preventDefault();
            if (!currentUser) { openAuthModal(); showToast("Entre para comentar.", true); return; }
            const input = document.getElementById("commentInput");
            const value = input.value.trim();
            if (!value || value.length > 1000) return;
            try {
                await db.collection("recipes").doc(String(recipeId)).collection("comments").add({
                    text: value, authorUid: currentUser.uid,
                    authorName: currentUser.displayName || (currentUser.email ? currentUser.email.split("@")[0] : "Usuário"),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                input.value = "";
                showToast("Comentário publicado!");
            } catch (err) { showToast("Não foi possível publicar: " + err.message, true); }
        }

        function changeServings(id, delta) {
            currentServings = Math.min(50, Math.max(1, currentServings + delta));
            const recipe = recipes.find(r => r.id === id);
            if (recipe) renderDetailCard(recipe);
        }

        function renderRelated(recipe) {
            const list = document.getElementById("relatedList");
            list.innerHTML = "";
            const related = recipes.filter(r => r.category === recipe.category && r.id !== recipe.id).slice(0, 3);

            if (related.length === 0) {
                list.innerHTML = `<p class="text-sm text-gray-500">Nenhuma outra receita relacionada.</p>`;
                return;
            }
            related.forEach(rel => {
                const item = document.createElement("div");
                item.className = "flex items-center space-x-3 bg-white p-3 rounded-xl border border-gray-100 hover:shadow-sm transition cursor-pointer";
                item.onclick = () => showRecipeDetails(rel.id);
                item.innerHTML = `
                    ${imgTag(rel, "w-16 h-16 object-cover rounded-lg flex-shrink-0")}
                    <div>
                        <h4 class="font-bold text-gray-900 text-sm line-clamp-1">${esc(rel.title)}</h4>
                        <span class="text-xs text-gray-500">${esc(rel.prepTime)}</span>
                    </div>`;
                list.appendChild(item);
            });
        }

        function goHome() {
            document.getElementById("detailView").classList.add("hidden");
            document.getElementById("catalogView").classList.remove("hidden");
            currentRecipeId = null;
            if (commentsUnsub) { commentsUnsub(); commentsUnsub = null; }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ================= INICIALIZAÇÃO =================
        updateFavCount();
        filterRecipes();
    </script>
</body>
</html>
